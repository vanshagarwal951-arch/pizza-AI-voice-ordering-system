[project]
name = "web"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "menu-engine",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "livekit-api>=0.8.0",
    "python-dotenv>=1.0",
]

[project.scripts]
web = "web.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web"]

[tool.uv.sources]
menu-engine = { workspace = true }
