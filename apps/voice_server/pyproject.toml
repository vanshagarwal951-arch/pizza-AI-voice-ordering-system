[project]
name = "voice-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "menu-engine",
    "livekit-agents>=1.0",
    "livekit-plugins-deepgram>=1.0",
    "livekit-plugins-openai>=1.0",
    "livekit-plugins-silero>=1.0",
    "python-dotenv>=1.0",
    "edge-tts>=6.1.0",
]

[project.scripts]
voice-agent = "voice_server.agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voice_server"]

[tool.uv.sources]
menu-engine = { workspace = true }
